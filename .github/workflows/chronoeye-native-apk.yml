name: ChronoEye native APK
on:
  workflow_dispatch:
  push:
    branches: [chronoeye/native-ar-prototype]
    paths: ['native-prototype/**', '.github/workflows/chronoeye-native-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: python3 prepare_assets.py
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoEye-AR-Lab-v0.1.0-debug
          path: native-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
