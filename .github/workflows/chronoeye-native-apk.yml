name: ChronoEye native APK
on:
  workflow_dispatch:
  push:
    branches: [chronoeye/native-ar-prototype, 'chronoeye/ar-diagnostics-*', 'chronoeye/ar-depth-v4-*']
    paths: ['native-prototype/**', '.github/workflows/chronoeye-native-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - run: python3 prepare_assets.py
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - run: python3 -m unittest discover -s tools -v
      - run: '$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoEye-AR-Lab-debug
          path: native-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
