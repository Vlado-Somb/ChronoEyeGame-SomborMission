name: Taban 3D review build
on:
  push:
    branches:
      - feature/taban-church-historical-reconstruction
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install trimesh numpy
      - run: python game-data/budapest/v1/production/05-taban/build_taban.py
      - run: sudo apt-get update -qq && sudo apt-get install -y blender
      - run: blender -b --python game-data/budapest/v1/production/05-taban/export_taban_blender.py
      - uses: actions/upload-artifact@v4
        with:
          name: taban-review-3d
          path: game-data/budapest/v1/production/05-taban/generated/
